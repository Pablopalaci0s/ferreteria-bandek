# Reemplazá "tu-dominio.com" por el dominio real antes de activar.
# certbot --nginx agrega automáticamente el bloque de HTTPS y el
# redirect de 80 -> 443 la primera vez que lo corrés.

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    root /var/www/bandek/public;
    index index.php;

    # Sube el límite de subida de imágenes (ReglaImagen permite hasta 5 MB).
    client_max_body_size 8M;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # No servir directorios ni archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/bandek-access.log;
    error_log  /var/log/nginx/bandek-error.log;
}
