name: Keep-alive (opcional)

# Render free tier duerme el servicio tras 15 min sin tráfico, y el primer
# visitante después de eso espera 30-60s (cold start). Este ping opcional
# lo mantiene despierto. No es gratis "sin límite": consume minutos de
# GitHub Actions (en repos privados hay 2000 min/mes gratis; esto usa
# unos pocos segundos por corrida, ~4320 corridas/mes, así que entra sin
# problema) y también gasta horas de las 750 free de Render — igual entran,
# 750 horas alcanza para un servicio corriendo todo el mes.
#
# Si no lo querés, borrá este archivo: el sitio funciona igual, solo que el
# primer visitante después de una pausa espera el cold start.
#
# GitHub pausa los workflows programados si el repo pasa 60 días sin
# actividad (commits, etc.) — hay que "reactivarlo" a mano desde la pestaña
# Actions si eso pasa.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /up
        run: curl -sS -f "${{ secrets.APP_URL }}/up"
